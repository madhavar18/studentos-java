spring.application.name=studentos

# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studentos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:yourpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# ddl-auto=update: Hibernate compares your @Entity classes to the database schema
# If the table does not exist: creates it
# If the table exists but is missing columns: adds them
# NEVER use ddl-auto=create in production — it drops and recreates tables on startup
# NEVER use ddl-auto=drop-create — same problem

# Show the SQL Hibernate generates in the console
# Critical for learning and debugging — you see exactly what queries run
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson date handling
# spring.jackson.serialization.write-dates-as-timestamps=false